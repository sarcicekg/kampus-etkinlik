<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Etkinlik Ekle - Kampüs Etkinlikleri</title>
  <link rel="stylesheet" href="css/2221032076.css">
</head>
<body>

  <header>
    <h1>Kampüs Etkinlikleri</h1>
    <nav>
      <ul>
        <li><a href="index.html">Ana Sayfa</a></li>
        <li><a href="etkinlikler.html">Etkinlikler</a></li>
        <li><a href="etkinlik-ekle.html" class="active">Ekle</a></li>
        <li><a href="etkinlik-guncelle.html">Güncelle</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h2>Etkinlik Ekle</h2>

    <form action="#" method="post">
      <div class="form-group">
        <label for="etkinlik-adi">Etkinlik Adı</label>
        <input type="text" id="etkinlik-adi" name="etkinlik-adi" required placeholder="Etkinlik adını giriniz">
      </div>

      <div class="form-group">
        <label for="kategori">Kategori</label>
        <select id="kategori" name="kategori" required>
          <option value="">Seçiniz</option>
          <option value="seminer">Seminer</option>
          <option value="atolye">Atölye</option>
          <option value="soylesi">Söyleşi</option>
        </select>
      </div>

      <div class="form-group">
        <label for="tarih">Tarih</label>
        <input type="date" id="tarih" name="tarih" required>
      </div>

      <div class="form-group">
        <label for="aciklama">Açıklama</label>
        <textarea id="aciklama" name="aciklama" rows="4" placeholder="Etkinlik açıklamasını giriniz"></textarea>
      </div>

      <div>
        <button type="submit">Kaydet</button>
      </div>
    </form>
  </main>

  <footer>
    <p>Gökhan Sarıçiçek - 2221032076</p>
  </footer>

</body>
</html>
