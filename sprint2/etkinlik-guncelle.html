<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kampüs Etkinlikleri - Etkinlik Güncelle</title>
    <link rel="stylesheet" href="css/2221032076.css">
</head>
<body>

    <header>
  <h1>Kampüs Etkinlikleri</h1>
  <nav>
    <ul>
      <li><a href="index.html">Ana Sayfa</a></li>
      <li><a href="etkinlikler.html">Etkinlikler</a></li>
      <li><a href="etkinlik-ekle.html">Ekle</a></li>
      <li><a href="etkinlik-guncelle.html">Güncelle</a></li>
    </ul>
  </nav>
</header>

    <main>
        <h2>Etkinlik Güncelle</h2>

        <form action="#" method="post">
            <p>
                <label for="etkinlik-adi">Etkinlik Adı:</label><br>
                <input type="text" id="etkinlik-adi" name="etkinlik-adi" value="Kariyer Günleri" required>
            </p>

            <p>
                <label for="kategori">Kategori:</label><br>
                <select id="kategori" name="kategori" required>
                    <option value="Seminer" selected>Seminer</option>
                    <option value="Atölye">Atölye</option>
                </select>
            </p>

            <p>
                <label for="tarih">Tarih:</label><br>
                <input type="date" id="tarih" name="tarih" value="2026-10-12" required>
            </p>

            <p>
                <label for="yer">Yer:</label><br>
                <input type="text" id="yer" name="yer" value="A Blok Salon" required>
            </p>

            <p>
                <label for="kontenjan">Kontenjan:</label><br>
                <input type="number" id="kontenjan" name="kontenjan" value="120" min="1" required>
            </p>

            <p>
                <label for="aciklama">Açıklama:</label><br>
                <textarea id="aciklama" name="aciklama" rows="4" cols="40" required>Mezun söyleşileri</textarea>
            </p>

            <p>
                <button type="submit">Güncelle</button>
            </p>
        </form>
    </main>

    <footer>
        <p>Gökhan Sarıçiçek&copy; 2026 Kampüs Etkinlikleri</p>
    </footer>

</body>
</html>
